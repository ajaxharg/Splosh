<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" role="img">
<title>Changing model</title>
<desc>A client talks to a supervisor that holds the port and an engine process with model A; when a request names model B the supervisor keeps it until model A's requests have finished, then the engine process is replaced by one with model B, which answers the kept request.</desc>
<style>
  .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .t{font-size:14px}
  .ts{font-size:14px;fill:#59636e}
  .tb{font-size:14px;font-weight:600}
  .n{font-size:12px;fill:#59636e}
  .h{font-size:16px;font-weight:600}
  .ln{fill:none;stroke:#59636e;stroke-width:1.5}
  .mk{fill:#59636e}
  .box,.panel,.blue,.amber,.green,.grey,.violet{stroke-width:1.5}
  .box{fill:#ffffff;stroke:#59636e}
  .panel{fill:#f6f8fa;stroke:#d0d7de}
  .blue{fill:#ddf4ff;stroke:#0969da}
  .amber{fill:#fff1c2;stroke:#bf8700}
  .green{fill:#dafbe1;stroke:#1a7f37}
  .grey{fill:#eaeef2;stroke:#8c959f}
  .violet{fill:#f1e8ff;stroke:#8250df}
  .dash{stroke-dasharray:5 4}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117;stroke:#30363d}
    text{fill:#e6edf3}
    .ts,.n{fill:#9198a1}
    .ln{stroke:#9198a1}
    .mk{fill:#9198a1}
    .box{fill:#0d1117;stroke:#9198a1}
    .panel{fill:#161b22;stroke:#30363d}
    .blue{fill:#0c2d54;stroke:#58a6ff}
    .amber{fill:#3b2a05;stroke:#d29922}
    .green{fill:#0f2d1a;stroke:#3fb950}
    .grey{fill:#21262d;stroke:#6e7681}
    .violet{fill:#2b1b4d;stroke:#a371f7}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk" d="M0.5 0.5 L7.5 4 L0.5 7.5 Z"/></marker>
</defs>
<rect class="bg" x="0.75" y="0.75" width="958.5" height="452.5" rx="10"/>

<!-- a: model A answers -->
<rect class="panel" x="24" y="24" width="288" height="386" rx="6"/>
<text class="h" x="40" y="50">a. Model A is answering</text>
<rect class="box" x="68" y="64" width="200" height="34" rx="6"/>
<text class="t" x="168" y="86" text-anchor="middle">client</text>
<line class="ln" x1="168" y1="98" x2="168" y2="130" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="box" x="52" y="130" width="232" height="56" rx="6"/>
<text class="t" x="168" y="153" text-anchor="middle">supervisor</text>
<text class="ts" x="168" y="171" text-anchor="middle">holds the port</text>
<line class="ln" x1="168" y1="186" x2="168" y2="262" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="blue" x="52" y="262" width="232" height="64" rx="6"/>
<text class="t" x="168" y="283" text-anchor="middle">engine process</text>
<rect class="amber" x="123" y="292" width="90" height="24" rx="6"/>
<text class="t" x="168" y="308.5" text-anchor="middle">model A</text>
<text class="n" x="168" y="352" text-anchor="middle">answering requests</text>

<line class="ln" x1="315" y1="217" x2="333" y2="217" marker-end="url(#ah)"/>

<!-- b: a request names model B -->
<rect class="panel" x="336" y="24" width="288" height="386" rx="6"/>
<text class="h" x="352" y="50">b. A request names model B</text>
<rect class="box" x="380" y="64" width="200" height="34" rx="6"/>
<text class="t" x="480" y="86" text-anchor="middle">client</text>
<line class="ln" x1="480" y1="98" x2="480" y2="130" marker-end="url(#ah)"/>
<text class="n" x="492" y="118">asks for model B</text>
<rect class="box" x="364" y="130" width="232" height="92" rx="6"/>
<text class="t" x="480" y="153" text-anchor="middle">supervisor</text>
<text class="ts" x="480" y="171" text-anchor="middle">holds the port</text>
<rect class="green" x="380" y="182" width="200" height="30" rx="6"/>
<text class="t" x="480" y="202" text-anchor="middle">request for model B: kept</text>
<line class="ln" x1="396" y1="222" x2="396" y2="262" marker-end="url(#ah)"/>
<line class="ln" x1="424" y1="262" x2="424" y2="222" marker-end="url(#ah)"/>
<text class="n" x="436" y="240">the engine says it is</text>
<text class="n" x="436" y="254">for another model</text>
<rect class="blue" x="364" y="262" width="232" height="64" rx="6"/>
<text class="t" x="480" y="283" text-anchor="middle">engine process</text>
<rect class="amber" x="435" y="292" width="90" height="24" rx="6"/>
<text class="t" x="480" y="308.5" text-anchor="middle">model A</text>
<text class="n" x="480" y="350" text-anchor="middle">the supervisor keeps the request and waits</text>
<text class="n" x="480" y="364" text-anchor="middle">until model A's requests have finished</text>
<rect class="green" x="392" y="374" width="176" height="26" rx="6"/>
<text class="t" x="480" y="392" text-anchor="middle">nothing running is cut</text>

<line class="ln" x1="627" y1="217" x2="645" y2="217" marker-end="url(#ah)"/>

<!-- c: the engine is replaced -->
<rect class="panel" x="648" y="24" width="288" height="386" rx="6"/>
<text class="h" x="664" y="50">c. The engine is replaced</text>
<rect class="box" x="692" y="64" width="200" height="34" rx="6"/>
<text class="t" x="792" y="86" text-anchor="middle">client</text>
<line class="ln" x1="792" y1="98" x2="792" y2="130" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect class="box" x="676" y="130" width="232" height="92" rx="6"/>
<text class="t" x="792" y="153" text-anchor="middle">supervisor</text>
<text class="ts" x="792" y="171" text-anchor="middle">holds the port</text>
<rect class="green" x="692" y="182" width="200" height="30" rx="6"/>
<text class="t" x="792" y="202" text-anchor="middle">request for model B</text>
<line class="ln" x1="792" y1="222" x2="792" y2="262" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="n" x="804" y="246">the kept request</text>
<rect class="blue" x="676" y="262" width="232" height="64" rx="6"/>
<text class="t" x="792" y="283" text-anchor="middle">engine process</text>
<rect class="amber" x="747" y="292" width="90" height="24" rx="6"/>
<text class="t" x="792" y="308.5" text-anchor="middle">model B</text>
<rect class="grey dash" x="676" y="338" width="232" height="28" rx="6"/>
<text class="ts" x="792" y="357" text-anchor="middle">engine with model A: replaced</text>
<text class="n" x="792" y="390" text-anchor="middle">the kept request is answered by model B</text>

<text class="n" x="24" y="436">one model in memory at a time; a switch took 10-14 s in a trial; a name that is not registered is served by whichever model is loaded</text>
</svg>
